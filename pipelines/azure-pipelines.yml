trigger:
  branches:
    include:
      - main
      - develop

variables:
  - group: underworld-secrets
  - name: containerRegistry
    value: 'underworldacr.azurecr.io'
  - name: imageTag
    value: '$(Build.BuildId)'

stages:

  # ── Stage: Build & Test ──────────────────────────────────────
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET 10'
            inputs:
              version: '10.x'

          - script: dotnet restore
            displayName: 'Restore packages'

          - script: dotnet build --no-restore -c Release
            displayName: 'Build solution'

          # ── Sales Domain Tests ──────────────────────────────
          - script: |
              dotnet test tests/UnderworldAPI.Sales.Domain.Tests/UnderworldAPI.Sales.Domain.Tests.csproj \
                -c Release \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --logger "trx;LogFileName=sales-domain.trx"
            displayName: 'Run Sales Domain Tests'

          # ── Sales Application Tests ─────────────────────────
          - script: |
              dotnet test tests/UnderworldAPI.Sales.Application.Tests/UnderworldAPI.Sales.Application.Tests.csproj \
                -c Release \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --logger "trx;LogFileName=sales-application.trx"
            displayName: 'Run Sales Application Tests'

          # ── Purchases Domain Tests ──────────────────────────
          - script: |
              dotnet test tests/UnderworldAPI.Purchases.Domain.Tests/UnderworldAPI.Purchases.Domain.Tests.csproj \
                -c Release \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --logger "trx;LogFileName=purchases-domain.trx"
            displayName: 'Run Purchases Domain Tests'

          # ── Purchases Application Tests ─────────────────────
          - script: |
              dotnet test tests/UnderworldAPI.Purchases.Application.Tests/UnderworldAPI.Purchases.Application.Tests.csproj \
                -c Release \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --logger "trx;LogFileName=purchases-application.trx"
            displayName: 'Run Purchases Application Tests'

          # ── Publicar resultados de tests ────────────────────
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              mergeTestResults: true
              testRunTitle: 'UnderworldAPI Tests'

          # ── Publicar cobertura de código ────────────────────
          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage'
            condition: always()
            inputs:
              summaryFileLocation: '**/coverage.cobertura.xml'

  # ── Stage: Docker Build & Push ───────────────────────────────
  - stage: Docker
    displayName: 'Build & Push Images'
    dependsOn: Build
    condition: and(succeeded(), or(
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(variables['Build.SourceBranch'], 'refs/heads/develop')))
    jobs:
      - job: BuildPushImages
        displayName: 'Build and Push Docker Images'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'ACR-UnderworldAPI'

          - task: Docker@2
            displayName: 'Build and Push Sales API'
            inputs:
              command: buildAndPush
              containerRegistry: 'ACR-UnderworldAPI'
              repository: 'underworld-sales-api'
              dockerfile: 'src/Services/Sales/UnderworldAPI.Sales.API/Dockerfile'
              buildContext: '.'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Build and Push Purchases API'
            inputs:
              command: buildAndPush
              containerRegistry: 'ACR-UnderworldAPI'
              repository: 'underworld-purchases-api'
              dockerfile: 'src/Services/Purchases/UnderworldAPI.Purchases.API/Dockerfile'
              buildContext: '.'
              tags: |
                $(imageTag)
                latest

  # ── Stage: Deploy ─────────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to Azure Container Apps'
    dependsOn: Docker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployAPIs
        displayName: 'Deploy to Container Apps'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                # ── Deploy Sales API ──────────────────────────
                - task: AzureCLI@2
                  displayName: 'Deploy Sales API to Container Apps'
                  inputs:
                    azureSubscription: 'Azure-UnderworldAPI'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Intenta crear — si ya existe actualiza la imagen
                      az containerapp create \
                        --name underworld-sales-api \
                        --resource-group $(RESOURCE_GROUP) \
                        --environment $(CONTAINER_APP_ENV) \
                        --image $(containerRegistry)/underworld-sales-api:$(imageTag) \
                        --registry-server $(containerRegistry) \
                        --registry-username $(ACR_USERNAME) \
                        --registry-password $(ACR_PASSWORD) \
                        --target-port 8080 \
                        --ingress external \
                        --min-replicas 0 \
                        --max-replicas 3 \
                        --env-vars \
                          ASPNETCORE_ENVIRONMENT=Production \
                          ConnectionStrings__SalesDb="Server=sqlserver,1433;Database=UnderworldDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True;" \
                          AzureServiceBus__ConnectionString="$(SERVICE_BUS_CONNECTION)" \
                          AzureServiceBus__TopicName=sales-events \
                      || az containerapp update \
                        --name underworld-sales-api \
                        --resource-group $(RESOURCE_GROUP) \
                        --image $(containerRegistry)/underworld-sales-api:$(imageTag)

                # ── Deploy Purchases API ──────────────────────
                - task: AzureCLI@2
                  displayName: 'Deploy Purchases API to Container Apps'
                  inputs:
                    azureSubscription: 'Azure-UnderworldAPI'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp create \
                        --name underworld-purchases-api \
                        --resource-group $(RESOURCE_GROUP) \
                        --environment $(CONTAINER_APP_ENV) \
                        --image $(containerRegistry)/underworld-purchases-api:$(imageTag) \
                        --registry-server $(containerRegistry) \
                        --registry-username $(ACR_USERNAME) \
                        --registry-password $(ACR_PASSWORD) \
                        --target-port 8080 \
                        --ingress external \
                        --min-replicas 0 \
                        --max-replicas 3 \
                        --env-vars \
                          ASPNETCORE_ENVIRONMENT=Production \
                          ConnectionStrings__PurchasesDb="Server=sqlserver,1433;Database=UnderworldDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True;" \
                          AzureServiceBus__ConnectionString="$(SERVICE_BUS_CONNECTION)" \
                          AzureServiceBus__TopicName=purchases-events \
                      || az containerapp update \
                        --name underworld-purchases-api \
                        --resource-group $(RESOURCE_GROUP) \
                        --image $(containerRegistry)/underworld-purchases-api:$(imageTag)