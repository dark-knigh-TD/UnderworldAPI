trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/Sales/**
      - src/Services/Purchases/**
      - src/Shared/**

variables:
  containerRegistry: 'underworldacr.azurecr.io'
  imageTag: '$(Build.BuildId)'

stages:
  # ── Stage: Build & Test ──────────────────────────────────────
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '9.x'

          - script: dotnet restore
            displayName: 'Restore packages'

          - script: dotnet build --no-restore -c Release
            displayName: 'Build solution'

          - script: |
              dotnet test --no-build -c Release \
                --collect:"XPlat Code Coverage" \
                --results-directory $(Agent.TempDirectory)/TestResults
            displayName: 'Run tests'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.xml'

  # ── Stage: Docker Build & Push ───────────────────────────────
  - stage: DockerBuild
    displayName: 'Build & Push Docker Images'
    dependsOn: Build
    jobs:
      - job: BuildSalesImage
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Sales API image'
            inputs:
              command: buildAndPush
              containerRegistry: 'AzureContainerRegistry'
              repository: 'underworld-sales-api'
              dockerfile: 'src/Services/Sales/UnderworldAPI.Sales.API/Dockerfile'
              buildContext: '.'
              tags: |
                $(imageTag)
                latest

      - job: BuildPurchasesImage
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Purchases API image'
            inputs:
              command: buildAndPush
              containerRegistry: 'AzureContainerRegistry'
              repository: 'underworld-purchases-api'
              dockerfile: 'src/Services/Purchases/UnderworldAPI.Purchases.API/Dockerfile'
              buildContext: '.'
              tags: |
                $(imageTag)
                latest

  # ── Stage: Deploy to Azure Container Apps ────────────────────
  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: DockerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToContainerApps
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureContainerApps@1
                  displayName: 'Deploy Sales API'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    containerAppName: 'underworld-sales-api'
                    resourceGroup: 'rg-underworld-prod'
                    imageToDeploy: '$(containerRegistry)/underworld-sales-api:$(imageTag)'