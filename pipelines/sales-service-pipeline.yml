# Pipeline específico del microservicio Sales.
# Se dispara solo cuando hay cambios en Sales o en Shared.
# El pipeline principal (azure-pipelines.yml) coordina el deploy final.

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    include:
      - src/Services/Sales/**
      - src/Shared/**
      - tests/UnderworldAPI.Sales.Domain.Tests/**
      - tests/UnderworldAPI.Sales.Application.Tests/**

variables:
  buildConfiguration: 'Release'
  containerRegistry: 'underworldacr.azurecr.io'
  salesImageRepository: 'underworld-sales-api'
  imageTag: '$(Build.BuildId)'
  dotnetVersion: '10.x'

stages:

  # ── Stage: Restore & Build ───────────────────────────────────
  - stage: Build
    displayName: 'Build Sales Service'
    jobs:
      - job: Build
        displayName: 'Restore and Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET $(dotnetVersion)'
            inputs:
              version: '$(dotnetVersion)'

          - script: |
              dotnet restore src/Services/Sales/UnderworldAPI.Sales.API/UnderworldAPI.Sales.API.csproj
            displayName: 'Restore packages'

          - script: |
              dotnet build src/Services/Sales/UnderworldAPI.Sales.API/UnderworldAPI.Sales.API.csproj \
                --no-restore \
                -c $(buildConfiguration)
            displayName: 'Build Sales API'

  # ── Stage: Test ──────────────────────────────────────────────
  - stage: Test
    displayName: 'Test Sales Service'
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: 'Run Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '$(dotnetVersion)'

          - script: dotnet restore
            displayName: 'Restore all packages'

          - script: |
              dotnet test tests/UnderworldAPI.Sales.Domain.Tests/UnderworldAPI.Sales.Domain.Tests.csproj \
                -c $(buildConfiguration) \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --results-directory $(Agent.TempDirectory)/TestResults/Domain \
                --logger "trx;LogFileName=sales-domain-results.trx"
            displayName: 'Run Sales Domain Tests'

          - script: |
              dotnet test tests/UnderworldAPI.Sales.Application.Tests/UnderworldAPI.Sales.Application.Tests.csproj \
                -c $(buildConfiguration) \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --results-directory $(Agent.TempDirectory)/TestResults/Application \
                --logger "trx;LogFileName=sales-application-results.trx"
            displayName: 'Run Sales Application Tests'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              testRunTitle: 'Sales Service Tests'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage'
            condition: always()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

  # ── Stage: Docker Build & Push ───────────────────────────────
  - stage: Docker
    displayName: 'Build & Push Sales Image'
    dependsOn: Test
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')))
    jobs:
      - job: DockerBuildPush
        displayName: 'Build and Push Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'AzureContainerRegistry'

          - task: Docker@2
            displayName: 'Build and Push Sales API image'
            inputs:
              command: buildAndPush
              containerRegistry: 'AzureContainerRegistry'
              repository: '$(salesImageRepository)'
              dockerfile: 'src/Services/Sales/UnderworldAPI.Sales.API/Dockerfile'
              buildContext: '.'
              tags: |
                $(imageTag)
                latest

  # ── Stage: Deploy ─────────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy Sales API to Azure'
    dependsOn: Docker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToContainerApps
        displayName: 'Deploy to Azure Container Apps'
        environment: 'production-sales'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureContainerApps@1
                  displayName: 'Deploy Sales API'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    containerAppName: 'underworld-sales-api'
                    resourceGroup: 'rg-underworld-prod'
                    imageToDeploy: '$(containerRegistry)/$(salesImageRepository):$(imageTag)'